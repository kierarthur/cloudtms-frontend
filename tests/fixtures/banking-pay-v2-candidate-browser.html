<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidate Banking — local component verification</title>
<link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/banking-table.css">
<style>
body{margin:24px;background:#07101f;color:#f8fafc;font:14px 'Segoe UI',sans-serif;--panel:#101f35;--line:#2b405d}main{max-width:1280px;margin:auto}
.fixture-controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button{color:inherit;background:#152942;border:1px solid #3c526f;border-radius:5px;padding:6px 10px}
.btn-xs{padding:3px 7px;font-size:12px}.mini{font-size:12px}.mono{font-variant-numeric:tabular-nums}.pill{display:inline-flex;padding:3px 7px;border-radius:5px;background:#193049;font-size:12px}
